<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Data Hub</title>
<!-- 載入 Google 官方 API 腳本 -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --primary:#477aa3;--primary-soft:#edf5fa;--text:#263746;--muted:#7a8996;
  --border:#dce5eb;--bg:#f5f8fa;--card:#fff;--danger:#b54b4b;--shadow:0 10px 30px rgba(38,55,70,.10)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text);background:var(--bg)}
button,input,textarea,select{font:inherit} button{cursor:pointer}
.top{height:66px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;color:var(--primary);display:flex;gap:9px;align-items:center}.brand-icon{font-size:23px}
.actions{display:flex;gap:8px;align-items:center}.private,.edit-btn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 13px;color:var(--text);font-size:13px}
.edit-btn{color:var(--primary);font-weight:700}.edit-btn:hover{background:var(--primary-soft)}
.auth-status{font-size:13px;padding:6px 12px;border-radius:999px;background:#f0f4f8;color:var(--muted);font-weight:600}
.auth-status.online{background:#e8f8f0;color:#1e7e48}

.layout{max-width:1280px;margin:auto;padding:22px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}
.side{background:#fff;border:1px solid var(--border);border-radius:18px;padding:12px;height:calc(100vh - 110px);position:sticky;top:88px;overflow:auto}
.side-head{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 12px}.side h3{margin:0;font-size:16px}
.list{display:flex;flex-direction:column;gap:5px}.item{width:100%;text-align:left;border:0;background:transparent;border-radius:11px;padding:11px 12px;color:var(--text)}
.item:hover{background:#f3f7fa}.item.active{background:var(--primary-soft);color:var(--primary);font-weight:800}
.mobile{display:none;width:100%;padding:11px;border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:14px;color:var(--text)}

.head{background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:16px}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.head h2{margin:0 0 5px;font-size:22px}.head p{margin:0;color:var(--muted);font-size:13px}
.text-block{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:16px;white-space:pre-wrap;line-height:1.8;font-size:15px;min-height:110px}
.text-block.empty{color:#9aa7b1;font-style:italic}

.groups{display:flex;flex-direction:column;gap:20px}.group{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px}
.group-title{font-weight:800;font-size:17px;margin-bottom:16px}.group-title span{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}

/* 一張照片佔滿一整行 */
.subphotos{display:grid;grid-template-columns:1fr;gap:20px}
.photo{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.03)}
.pic{width:100%;background:#edf2f5;display:block;position:relative}
.pic img{width:100%;height:auto;display:block;object-fit:contain}
.label{padding:12px 16px;font-size:14px;font-weight:600;color:var(--text);border-top:1px solid var(--border);background:#fff}

.footer{text-align:center;color:#8a9aa8;font-size:12px;padding:22px 14px 30px}

/* Google 驗證遮罩 */
.auth-overlay{position:fixed;inset:0;background:rgba(245,248,250,.96);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.auth-box{background:#fff;border:1px solid var(--border);padding:36px;border-radius:24px;box-shadow:var(--shadow);max-width:400px;width:100%}
.auth-box h2{margin:0 0 10px;color:var(--text)}.auth-box p{color:var(--muted);font-size:14px;margin-bottom:24px;line-height:1.6}
.auth-btn{background:var(--primary);color:#fff;border:0;border-radius:12px;padding:12px 24px;font-weight:700;font-size:15px;width:100%}

@media(max-width:800px){
  .layout{grid-template-columns:1fr;padding:14px}.side{display:none}.mobile{display:block}
  .top{padding:0 14px}
  .group{padding:14px}
}
</style>
</head>
<body>

<!-- 未驗證遮罩 -->
<div id="authOverlay" class="auth-overlay">
  <div class="auth-box">
    <div style="font-size:42px;margin-bottom:12px">🔒</div>
    <h2>家庭資料平台</h2>
    <p>這是私人的相簿空間。請透過受信任的 Google 帳號存取資料。</p>
    <button class="auth-btn" onclick="handleAuthClick()">Google 登入驗證</button>
  </div>
</div>

<header class="top">
  <div class="brand"><span class="brand-icon">▦</span><span>Family Data Hub</span></div>
  <div class="actions">
    <span id="authStatus" class="auth-status">未驗證</span>
    <span class="private">🔒 私人</span>
  </div>
</header>

<main class="layout">
  <aside class="side">
    <div class="side-head">
      <h3>資料清單</h3>
    </div>
    <div id="list" class="list"></div>
  </aside>

  <section>
    <select id="mobile" class="mobile" aria-label="選擇資料" onchange="selectData(Number(this.value))"></select>

    <div class="head">
      <div class="head-row">
        <div>
          <h2 id="title">載入中...</h2>
          <p id="subtitle">請稍候</p>
        </div>
      </div>
    </div>

    <div id="textBlock" class="text-block empty">已連結 Google Drive 雲端資料夾。</div>
    <div id="groups" class="groups"></div>
  </section>
</main>

<footer class="footer">Family Data Hub｜GitHub 網頁介面 V5</footer>

<script>
const CLIENT_ID = '1026711348381-9t8n7uc7uptia51fufiu4ar459dh7kk7.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

const dataFolders = [
  { id: 1, name: "資料 1 (01-6245)", folderId: "1LgmAybOd9cZuPMbqO1JghC2YNe2i0UDD" },
  { id: 2, name: "資料 2 (02-1809)", folderId: "1BSEm2XziaHu4RLknf6OCEB9vUCuaisZ9" }
];

let tokenClient;
let accessToken = null;
let selectedId = 1;

function initOAuth() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (tokenResponse) => {
      if (tokenResponse.access_token) {
        accessToken = tokenResponse.access_token;
        document.getElementById('authOverlay').style.display = 'none';
        const statusEl = document.getElementById('authStatus');
        statusEl.textContent = '已連線';
        statusEl.classList.add('online');
        
        loadDrivePhotos();
      }
    },
  });
}

window.onload = function() {
  renderSidebar();
  let checkGapi = setInterval(() => {
    if (window.google && google.accounts) {
      clearInterval(checkGapi);
      initOAuth();
    }
  }, 100);
};

function handleAuthClick() {
  if (tokenClient) {
    tokenClient.requestAccessToken();
  }
}

function renderSidebar() {
  document.getElementById('list').innerHTML = dataFolders.map(x => `
    <button class="item ${x.id === selectedId ? 'active' : ''}" onclick="selectData(${x.id})">${escapeHtml(x.name)}</button>
  `).join('');
  document.getElementById('mobile').innerHTML = dataFolders.map(x => `
    <option value="${x.id}" ${x.id === selectedId ? 'selected' : ''}>${escapeHtml(x.name)}</option>
  `).join('');
}

function selectData(id) {
  selectedId = id;
  renderSidebar();
  if (accessToken) {
    loadDrivePhotos();
  }
}

async function loadDrivePhotos() {
  const folder = dataFolders.find(x => x.id === selectedId);
  if (!folder) return;

  document.getElementById('title').textContent = folder.name;
  document.getElementById('subtitle').textContent = "讀取 Google Drive 中...";
  document.getElementById('groups').innerHTML = "<div style='text-align:center;padding:40px;color:var(--muted)'>正在從雲端取得照片...</div>";

  try {
    const q = `'${folder.folderId}' in parents and mimeType contains 'image/' and trashed = false`;
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name,webContentLink)&pageSize=100`, {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    const data = await res.json();
    const files = data.files || [];

    renderPhotosGrid(files);
  } catch (err) {
    console.error(err);
    document.getElementById('groups').innerHTML = "<div style='text-align:center;padding:40px;color:var(--danger)'>讀取失敗，請確認存取權限。</div>";
  }
}

function renderPhotosGrid(files) {
  document.getElementById('subtitle').textContent = `共 ${files.length} 張照片`;

  if (files.length === 0) {
    document.getElementById('groups').innerHTML = "<div style='text-align:center;padding:40px;color:var(--muted)'>此資料夾目前沒有照片。</div>";
    return;
  }

  files.sort((a, b) => a.name.localeCompare(b.name));

  const groupsMap = {};
  files.forEach(f => {
    const parts = f.name.split('-');
    const groupKey = parts.length >= 3 ? `${parts[0]}-${parts[1]}-${parts[2]}` : '其他項目';
    if (!groupsMap[groupKey]) groupsMap[groupKey] = [];
    groupsMap[groupKey].push(f);
  });

  let html = '';
  for (const [groupName, groupFiles] of Object.entries(groupsMap)) {
    html += `
      <article class="group">
        <div class="group-title">${escapeHtml(groupName)} <span>${groupFiles.length} 張照片</span></div>
        <div class="subphotos">
          ${groupFiles.map(f => {
            // 使用大解析度 s1600 載入圖片
            const imgUrl = `https://lh3.googleusercontent.com/d/${f.id}=s1600`;
            return `
              <div class="photo">
                <div class="pic">
                  <img src="${imgUrl}" alt="${escapeHtml(f.name)}" loading="lazy">
                </div>
                <div class="label">${escapeHtml(f.name)}</div>
              </div>
            `;
          }).join('')}
        </div>
      </article>
    `;
  }

  document.getElementById('groups').innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
}
</script>
</body>
</html>
