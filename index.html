<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Data Hub</title>
<!-- 載入 Google 官方 API 腳本 -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- 載入 Markdown 解析器 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root{
  --primary:#477aa3;--primary-soft:#edf5fa;--text:#263746;--muted:#7a8996;
  --border:#dce5eb;--bg:#f5f8fa;--card:#fff;--danger:#b54b4b;--shadow:0 10px 30px rgba(38,55,70,.10)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth} /* 啟用平滑滾動效果 */
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text);background:var(--bg)}
button,input,textarea,select{font:inherit} button{cursor:pointer}
.top{height:66px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;color:var(--primary);display:flex;gap:9px;align-items:center}.brand-icon{font-size:23px}
.actions{display:flex;gap:8px;align-items:center}.private{border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 13px;color:var(--text);font-size:13px}
.auth-status{font-size:13px;padding:6px 12px;border-radius:999px;background:#f0f4f8;color:var(--muted);font-weight:600}
.auth-status.online{background:#e8f8f0;color:#1e7e48}

.layout{max-width:1400px;margin:auto;padding:22px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}
.side{background:#fff;border:1px solid var(--border);border-radius:18px;padding:12px;height:calc(100vh - 110px);position:sticky;top:88px;overflow:auto}
.side-head{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 12px}.side h3{margin:0;font-size:16px}
.list{display:flex;flex-direction:column;gap:5px}.item{width:100%;text-align:left;border:0;background:transparent;border-radius:11px;padding:11px 12px;color:var(--text)}
.item:hover{background:#f3f7fa}.item.active{background:var(--primary-soft);color:var(--primary);font-weight:800}
.mobile{display:none;width:100%;padding:11px;border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:14px;color:var(--text)}

.head{background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:16px}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.head h2{margin:0 0 5px;font-size:22px}.head p{margin:0;color:var(--muted);font-size:13px}

/* 文章區塊 Markdown 排版 */
.text-block{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px 24px;margin-bottom:16px;line-height:1.75;font-size:15px;color:var(--text)}
.text-block.empty{display:none}
.text-block h1,.text-block h2,.text-block h3{color:var(--primary);margin-top:1.2em;margin-bottom:0.6em;font-weight:700}
.text-block h1{font-size:1.4em;border-bottom:1px solid var(--border);padding-bottom:6px}
.text-block h2{font-size:1.2em}
.text-block p{margin:0.5em 0}
.text-block ul,.text-block ol{padding-left:20px;margin:0.5em 0}
.text-block li{margin-bottom:4px}
.text-block blockquote{margin:12px 0;padding:10px 16px;background:var(--primary-soft);border-left:4px solid var(--primary);border-radius:0 8px 8px 0;color:var(--text)}

.groups{display:flex;flex-direction:column;gap:24px}.group{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px}
.group-title{font-weight:800;font-size:18px;margin-bottom:16px;color:var(--primary);display:flex;align-items:center;justify-content:space-between}
.group-title span{font-size:13px;color:var(--muted);font-weight:500}

.subphotos{display:flex;flex-direction:column;gap:20px;width:100%}
.photo{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.04);width:100%}
.pic{width:100%;background:#edf2f5;display:block;cursor:zoom-in}
.pic img{width:100% !important;height:auto !important;display:block;object-fit:contain;max-width:100%}

.footer{text-align:center;color:#8a9aa8;font-size:12px;padding:22px 14px 30px}

/* 🚀 回到最上方按鈕樣式 */
.back-to-top {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 48px;
  height: 48px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 50%;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 99;
}
.back-to-top.show {
  opacity: 1;
  visibility: visible;
}
.back-to-top:hover {
  background: #366085;
  transform: translateY(-3px);
}

/* Google 驗證遮罩 */
.auth-overlay{position:fixed;inset:0;background:rgba(245,248,250,.96);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.auth-box{background:#fff;border:1px solid var(--border);padding:36px;border-radius:24px;box-shadow:var(--shadow);max-width:400px;width:100%}
.auth-box h2{margin:0 0 10px;color:var(--text)}.auth-box p{color:var(--muted);font-size:14px;margin-bottom:24px;line-height:1.6}
.auth-btn{background:var(--primary);color:#fff;border:0;border-radius:12px;padding:12px 24px;font-weight:700;font-size:15px;width:100%}

/* 全螢幕燈箱 */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:95vw;max-height:95vh;object-fit:contain;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

@media(max-width:800px){
  .layout{grid-template-columns:1fr;padding:10px}.side{display:none}.mobile{display:block}
  .top{padding:0 14px}.group{padding:12px}
  .back-to-top { bottom: 20px; right: 20px; width: 42px; height: 42px; font-size: 18px; }
}
</style>
</head>
<body>

<div id="authOverlay" class="auth-overlay">
  <div class="auth-box">
    <div style="font-size:42px;margin-bottom:12px">🔒</div>
    <h2>家庭資料平台</h2>
    <p>這是私人的相簿空間。請透過受信任的 Google 帳號存取資料。</p>
    <button class="auth-btn" onclick="handleAuthClick()">Google 登入驗證</button>
  </div>
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="大圖檢視">
</div>

<!-- 🚀 回到最上方按鈕元素 -->
<button id="backToTopBtn" class="back-to-top" onclick="scrollToTop()" title="回到最上方">▲</button>

<header class="top">
  <div class="brand"><span class="brand-icon">▦</span><span>Family Data Hub</span></div>
  <div class="actions">
    <span id="authStatus" class="auth-status">未驗證</span>
    <span class="private">🔒 私人</span>
  </div>
</header>

<main class="layout">
  <aside class="side">
    <div class="side-head">
      <h3>資料清單</h3>
    </div>
    <div id="list" class="list"></div>
  </aside>

  <section>
    <select id="mobile" class="mobile" aria-label="選擇資料" onchange="selectData(this.value)"></select>

    <div class="head">
      <div class="head-row">
        <div>
          <h2 id="title">載入中...</h2>
          <p id="subtitle">請稍候</p>
        </div>
      </div>
    </div>

    <!-- TXT 說明備註區 -->
    <div id="textBlock" class="text-block empty"></div>
    <div id="groups" class="groups"></div>
  </section>
</main>

<footer class="footer">Family Data Hub｜GitHub 網頁介面</footer>

<script>
const CLIENT_ID = '1026711348381-9t8n7uc7uptia51fufiu4ar459dh7kk7.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

const PARENT_FOLDER_ID = '1hueDTgwGrUwV5TbnUPQ1jKUIAtPToOFk';

let tokenClient;
let accessToken = sessionStorage.getItem('gdrive_token') || null;
let dataFolders = [];
let selectedFolderId = null;

function setAuthenticatedState(token) {
  accessToken = token;
  sessionStorage.setItem('gdrive_token', token);
  document.getElementById('authOverlay').style.display = 'none';
  const statusEl = document.getElementById('authStatus');
  statusEl.textContent = '已連線';
  statusEl.classList.add('online');
}

function initOAuth() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (tokenResponse) => {
      if (tokenResponse.access_token) {
        setAuthenticatedState(tokenResponse.access_token);
        fetchSubFolders();
      }
    },
  });

  if (accessToken) {
    setAuthenticatedState(accessToken);
    fetchSubFolders();
  }
}

window.onload = function() {
  let checkGapi = setInterval(() => {
    if (window.google && google.accounts) {
      clearInterval(checkGapi);
      initOAuth();
    }
  }, 100);

  // 監聽視窗捲動，控制按鈕顯示與隱藏
  window.addEventListener('scroll', function() {
    const btn = document.getElementById('backToTopBtn');
    if (window.scrollY > 300) {
      btn.classList.add('show');
    } else {
      btn.classList.remove('show');
    }
  });
};

function handleAuthClick() {
  if (tokenClient) {
    tokenClient.requestAccessToken();
  }
}

// 點擊按鈕後平滑滾動回頂部
function scrollToTop() {
  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}

async function fetchSubFolders() {
  try {
    const q = `'${PARENT_FOLDER_ID}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)&pageSize=100`, {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    
    if (res.status === 401) {
      sessionStorage.removeItem('gdrive_token');
      document.getElementById('authOverlay').style.display = 'flex';
      return;
    }

    const data = await res.json();
    dataFolders = data.files || [];
    
    dataFolders.sort((a, b) => naturalSort(a.name, b.name));

    if (dataFolders.length > 0) {
      if (!selectedFolderId || !dataFolders.some(x => x.id === selectedFolderId)) {
        selectedFolderId = dataFolders[0].id;
      }
      renderSidebar();
      loadDrivePhotos();
    } else {
      document.getElementById('title').textContent = "未找到資料夾";
      document.getElementById('subtitle').textContent = "請確認總資料夾內是否有子資料夾";
      document.getElementById('groups').innerHTML = "";
    }
  } catch (e) {
    console.error("無法取得資料夾清單", e);
  }
}

function renderSidebar() {
  document.getElementById('list').innerHTML = dataFolders.map(x => `
    <button class="item ${x.id === selectedFolderId ? 'active' : ''}" onclick="selectData('${x.id}')">${escapeHtml(x.name)}</button>
  `).join('');
  document.getElementById('mobile').innerHTML = dataFolders.map(x => `
    <option value="${x.id}" ${x.id === selectedFolderId ? 'selected' : ''}>${escapeHtml(x.name)}</option>
  `).join('');
}

function selectData(folderId) {
  selectedFolderId = folderId;
  renderSidebar();
  if (accessToken) {
    loadDrivePhotos();
  }
}

async function loadDrivePhotos() {
  const folder = dataFolders.find(x => x.id === selectedFolderId);
  if (!folder) return;

  document.getElementById('title').textContent = folder.name;
  document.getElementById('subtitle').textContent = "讀取 Google Drive 中...";
  document.getElementById('groups').innerHTML = "<div style='text-align:center;padding:40px;color:var(--muted)'>正在從雲端取得照片...</div>";

  const tb = document.getElementById('textBlock');
  tb.style.display = 'none';

  try {
    const q = `'${folder.id}' in parents and (mimeType contains 'image/' or mimeType = 'text/plain') and trashed = false`;
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name,mimeType)&pageSize=100`, {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    
    if (res.status === 401) {
      sessionStorage.removeItem('gdrive_token');
      document.getElementById('authOverlay').style.display = 'flex';
      return;
    }

    const data = await res.json();
    const files = data.files || [];

    const txtFile = files.find(f => f.mimeType === 'text/plain');
    if (txtFile) {
      loadTxtContent(txtFile.id);
    }

    const imgFiles = files.filter(f => f.mimeType.includes('image/'));
    renderPhotosGrid(imgFiles);
  } catch (err) {
    console.error(err);
    document.getElementById('groups').innerHTML = "<div style='text-align:center;padding:40px;color:var(--danger)'>讀取失敗，請確認存取權限。</div>";
  }
}

async function loadTxtContent(fileId) {
  try {
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    const text = await res.text();
    const tb = document.getElementById('textBlock');
    
    if (text.trim() !== "") {
      tb.style.display = 'block';
      tb.innerHTML = marked.parse(text);
      tb.classList.remove('empty');
    }
  } catch (e) {
    console.error("無法讀取說明檔", e);
  }
}

function renderPhotosGrid(files) {
  document.getElementById('subtitle').textContent = `共 ${files.length} 張照片`;

  if (files.length === 0) {
    document.getElementById('groups').innerHTML = "<div style='text-align:center;padding:40px;color:var(--muted)'>此資料夾目前沒有照片。</div>";
    return;
  }

  files.sort((a, b) => naturalSort(a.name, b.name));

  const groupsMap = {};
  files.forEach(f => {
    const cleanName = f.name.replace(/\.[^/.]+$/, "");
    const groupKey = cleanName.includes('-') ? cleanName.split('-')[0].trim() : cleanName;

    if (!groupsMap[groupKey]) groupsMap[groupKey] = [];
    groupsMap[groupKey].push(f);
  });

  let html = '';
  // 依照群組名稱重新排序，確保 01 一定在 011 前面
  const sortedGroups = Object.entries(groupsMap).sort((a, b) => naturalSort(a[0], b[0]));
  for (const [groupName, groupFiles] of sortedGroups) {
    const photoCountText = groupFiles.length > 1 ? `<span>${groupFiles.length} 張照片</span>` : '';
    
    html += `
      <article class="group">
        <div class="group-title">
          <div>${escapeHtml(groupName)}</div>
          ${photoCountText}
        </div>
        <div class="subphotos">
          ${groupFiles.map(f => {
            const imgUrl = `https://lh3.googleusercontent.com/d/${f.id}=s0`;
            return `
              <div class="photo">
                <div class="pic" onclick="openLightbox('${imgUrl}')" title="點擊放大圖片">
                  <img src="${imgUrl}" alt="${escapeHtml(f.name)}" loading="lazy">
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </article>
    `;
  }

  document.getElementById('groups').innerHTML = html;
}

// 自然數字排序：01、02、...、09、010、011、012...
// 同時支援像 01-6、02-1 這類名稱。
function naturalSort(a, b) {
  const partsA = String(a).match(/\\d+|\\D+/g) || [];
  const partsB = String(b).match(/\\d+|\\D+/g) || [];
  const len = Math.min(partsA.length, partsB.length);

  for (let i = 0; i < len; i++) {
    const pa = partsA[i];
    const pb = partsB[i];
    const na = /^\\d+$/.test(pa);
    const nb = /^\\d+$/.test(pb);

    if (na && nb) {
      const diff = Number(pa) - Number(pb);
      if (diff !== 0) return diff;
    } else {
      const diff = pa.localeCompare(pb, 'zh-Hant', {
        sensitivity: 'base',
        numeric: false
      });
      if (diff !== 0) return diff;
    }
  }

  return partsA.length - partsB.length;
}

function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('show');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
}
</script>
</body>
</html>
